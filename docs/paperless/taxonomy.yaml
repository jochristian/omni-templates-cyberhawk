# paperless-ngx baseline taxonomy — cyberhawk-talos-k8s
#
# Generic by design: this file contains no personal data and is safe in a public
# repo. Correspondents (your bank, employer, doctor) are deliberately NOT here —
# see correspondents.example.yaml and the README.
#
# Labels are Norwegian because the documents are. Match strings are what actually
# does the work, and they are matched against Norwegian OCR text regardless of
# what the labels say — renaming a label never breaks a match rule.
#
# matching_algorithm: 0=none 1=any 2=all 3=literal 4=regex 5=fuzzy 6=auto
#
# Everything below starts on `any`/`literal`, never `auto`. Per the upstream docs,
# auto-matching (a) ignores any document still carrying an inbox tag, (b) needs a
# meaningful number of positive AND negative examples, and (c) cannot learn
# subjective tags at all. On an empty install it would mislabel nearly everything.
# Revisit once you are past ~100 filed documents; see the README.

document_types:
  # Broad and few on purpose. Upstream guidance is ~10-15 types doing the heavy
  # lifting alongside correspondents, rather than 50 narrow ones. If you find
  # yourself wanting "Strømfaktura", that is a Faktura + the Strøm tag.
  - name: Faktura
    matching_algorithm: 1
    match: fakturanummer fakturadato forfallsdato
  - name: Kvittering
    matching_algorithm: 1
    match: kvittering kjøpskvittering salgskvittering
  - name: Kontoutskrift
    matching_algorithm: 1
    match: kontoutskrift kontoutdrag transaksjonsoversikt "account statement"
  - name: Årsoppgave
    matching_algorithm: 1
    match: årsoppgave årsoppgåve årsavregning årsoversikt
  - name: Lønnsslipp
    # Verified against the mandatory content of a Norwegian lønnsslipp
    # (skattebetalingsforskriften): the calculation of pay, tax withheld and the
    # holiday-pay basis must all appear, so these terms are effectively
    # guaranteed to be present.
    matching_algorithm: 1
    match: lønnsslipp lønnsspesifikasjon lønnsutbetaling bruttolønn nettolønn forskuddstrekk feriepenger payslip
  - name: Skattedokument
    # selvangivelse is the pre-2019 name, kept so older scans still classify.
    matching_algorithm: 1
    match: skattemelding skatteoppgjør skattekort frikort restskatt tilgodebeløp forskuddsskatt skattetrekksmelding selvangivelse
  - name: Kontrakt
    matching_algorithm: 1
    match: avtaledokument kontraktsvilkår leiekontrakt arbeidsavtale kjøpekontrakt
  - name: Forsikringsdokument
    matching_algorithm: 1
    match: forsikringsbevis forsikringsavtale forsikringspolise polisenummer "insurance policy"
  - name: Purring
    # Worth its own type rather than a tag: it is the one document class where
    # "did I miss this?" is the whole question, and a saved view on it is useful.
    #
    # Deliberately does NOT match the bare word "purring". Norwegian invoices
    # carry payment-terms boilerplate along the lines of "Ved purring beregnes
    # gebyr kr 35,00", so that token appears on ordinary invoices that are not
    # reminders at all. Only inkasso-stage vocabulary is specific enough.
    matching_algorithm: 1
    match: inkassovarsel betalingsoppfordring inkassokrav purringsgebyr
  - name: Attest
    matching_algorithm: 1
    match: attest vitnemål karakterutskrift sertifikat fagbrev kompetansebevis
  - name: Garantibevis
    matching_algorithm: 1
    match: garantibevis garantivilkår reklamasjonsrett garantiperiode
  - name: Bruksanvisning
    matching_algorithm: 1
    match: bruksanvisning brukerhåndbok brukerveiledning "user manual" "instruction manual"
  - name: Ordrebekreftelse
    # For the Gmail _viktig/_bestilling label. Deliberately narrow: `ordrenummer`
    # alone would also match plenty of invoices, and document type is
    # single-valued, so an over-broad rule here steals documents from Faktura.
    matching_algorithm: 4
    match: ordrebekreftelse|order confirmation|takk for (din )?bestilling
  - name: Billett
    # Flight/train/event tickets and their receipts. Regex and bilingual on
    # purpose: travel documents arrive in English far more often than Norwegian
    # (an SAS e-ticket is issued entirely in English), so a Norwegian-only word
    # list never matches them.
    matching_algorithm: 4
    match: billett|itinerary|electronic ticket|e-?ticket|boarding pass
  - name: Brev
    # No match: far too generic to auto-assign. This is the manual fallback for
    # anything that is simply a letter.
    matching_algorithm: 0
    match: ""

tags:
  # ~30 tags, nested two deep. Upstream guidance is to keep tags relatively few
  # and let correspondent + document type carry most of the meaning. Nesting is
  # a v2.19+ feature: adding a child automatically adds its parents, so tagging
  # a document "Strøm" also files it under "Bolig" without extra clicks.
  #
  # Max nesting depth is 5. This template uses 2.

  # ---- Ingest triage ------------------------------------------------------
  # This is an ARCHIVE, not a task system. Bills are paid elsewhere (AvtaleGiro,
  # nettbank); paperless exists so the paper can be found again years later.
  # So there is no TODO tag and nothing here tracks outstanding action.
  #
  # Innboks stays, because it is not a task marker — it is the difference between
  # "arrived" and "checked and filed", which is archival hygiene. Auto-matching
  # also ignores anything still carrying an inbox tag, so the queue is what keeps
  # the classifier learning from reviewed documents only.
  - name: Innboks
    color: "#d32f2f"
    is_inbox_tag: true
    matching_algorithm: 0
    match: ""

  # ---- Subject areas ------------------------------------------------------
  - name: Økonomi
    color: "#1976d2"
    matching_algorithm: 0
    match: ""
  - name: Bank
    parent: Økonomi
    color: "#1976d2"
    matching_algorithm: 0
    match: ""
  - name: Lån
    parent: Økonomi
    color: "#1976d2"
    matching_algorithm: 4
    match: lånenummer|nedbetalingsplan|terminbeløp|restgjeld|avdrag|nominell rente|effektiv rente
  - name: Sparing
    parent: Økonomi
    color: "#1976d2"
    matching_algorithm: 0
    match: ""
  - name: Pensjon
    parent: Økonomi
    color: "#1976d2"
    matching_algorithm: 1
    match: pensjonsbeholdning pensjonskapitalbevis tjenestepensjon
  - name: Investering
    parent: Økonomi
    color: "#1976d2"
    matching_algorithm: 1
    match: verdipapir aksjesparekonto fondsandeler

  - name: Bolig
    color: "#388e3c"
    matching_algorithm: 0
    match: ""
  - name: Strøm
    parent: Bolig
    color: "#388e3c"
    # A Norwegian strømfaktura is always three parts — energy, nettleie, and
    # state levies — so nettleie/elsertifikat/forbruksavgift/Enova appear on
    # essentially every one regardless of supplier. målepunkt-ID and målernummer
    # identify the meter and appear nowhere else at all.
    matching_algorithm: 4
    match: nettleie|elsertifikat|forbruksavgift|elavgift|enova|målepunkt|målernummer|strømforbruk|strømregning|spotpris|fastledd|energiledd|\bkwh\b
  - name: Kommunale avgifter
    parent: Bolig
    color: "#388e3c"
    matching_algorithm: 1
    # Multi-word terms MUST be quoted. `any` splits on whitespace and searches
    # each token as \bword\b, so the unquoted form of this rule contained the
    # standalone token `og` — which matches virtually every Norwegian document.
    # It put this tag on a broadband invoice on day one.
    match: '"kommunale avgifter" renovasjon "vann og avløp" feiing'
  - name: Internett og TV
    parent: Bolig
    color: "#388e3c"
    matching_algorithm: 1
    match: bredbånd fiberabonnement tv-pakke
  - name: Vedlikehold
    parent: Bolig
    color: "#388e3c"
    matching_algorithm: 0
    match: ""
  - name: Borettslag
    parent: Bolig
    color: "#388e3c"
    matching_algorithm: 1
    match: felleskostnader borettslag sameie andelsnummer

  - name: Kjøretøy
    color: "#7b1fa2"
    matching_algorithm: 0
    match: ""
  - name: Bil
    parent: Kjøretøy
    color: "#7b1fa2"
    # trafikkforsikringsavgift replaced the old årsavgift in 2018 and is now
    # collected with the insurance premium, so it lands on insurance documents
    # rather than a separate state bill — both spellings kept for older scans.
    matching_algorithm: 4
    match: registreringsnummer|kjøretøy|vognkort|trafikkforsikringsavgift|årsavgift|omregistrering|understellsnummer|statens vegvesen
  - name: Verksted
    parent: Kjøretøy
    color: "#7b1fa2"
    # "periodisk kjøretøykontroll" quoted — unquoted it would split into three
    # tokens and `kontroll` alone matches far too much.
    matching_algorithm: 1
    match: eu-kontroll "periodisk kjøretøykontroll" verkstedregning kilometerstand
  - name: Bompenger
    parent: Kjøretøy
    color: "#7b1fa2"
    # Regex rather than `any`, because this vocabulary inflects heavily and `any`
    # is word-bounded: \bbompenger\b misses "bompengepassering", \bbombrikke\b
    # misses "bombrikken". A real AutoSync invoice matched none of the original
    # word list (bompenger / autopass / ferjekort) — it says "bombrikke" and
    # "bom- og ferjepasseringer", and the operator is not AutoPASS-branded.
    # Stems catch every form. Operator names belong in correspondents, not here.
    matching_algorithm: 4
    match: bompeng|bombrikk|bompasser|ferjepasser|autopass

  - name: Forsikring
    color: "#0097a7"
    matching_algorithm: 1
    # `egenandel` deliberately removed: it is equally at home on a health
    # document, so it put both Forsikring and Helse on the same paper.
    match: forsikringsnummer forsikringspremie forsikringsbevis polisenummer
  - name: Helse
    color: "#c2185b"
    matching_algorithm: 4
    match: egenandel|frikort|helsenorge|resept|henvisning|pasientjournal|legeerklær|sykmelding|helfo
  - name: Jobb
    color: "#5d4037"
    # arbeidsgiver appears on every lønnsslipp, which is the point — the payslip
    # gets the Lønnsslipp type and this tag, and both are useful.
    matching_algorithm: 4
    match: arbeidsgiver|arbeidsforhold|arbeidsavtale|stillingsinstruks|ansettelse|permittering
  - name: Skatt
    color: "#455a64"
    matching_algorithm: 1
    match: skatteetaten skattemelding restskatt skattekort
  - name: Familie
    color: "#ad1457"
    matching_algorithm: 0
    match: ""
  - name: Abonnement
    color: "#00796b"
    matching_algorithm: 1
    match: abonnement bindingstid oppsigelsesfrist
  - name: Utdanning
    # Lånekassen is also matched by Offentlig; both tags on a student loan
    # statement is correct, not a conflict.
    color: "#512da8"
    matching_algorithm: 4
    match: lånekassen|vitnemål|karakterutskrift|studiepoeng|semesteravgift|studentbevis|eksamensresultat
  - name: Medlemskap
    # Fagforening, professional bodies, clubs. Distinct from Abonnement: a
    # membership has terms and a ballot, a subscription just bills you.
    color: "#00838f"
    matching_algorithm: 4
    match: medlemskontingent|medlemsnummer|fagforening|kontingent|medlemskap
  - name: Reise
    # Flights, hotels, foreign transit. Kept flat rather than nested (Fly /
    # Hotell / Transport) until the volume justifies it — subcategories with two
    # documents in them are just extra clicks.
    #
    # Bilingual regex, same reason as the Billett type: these documents are
    # rarely in Norwegian, and a foreign transit statement may be in a third
    # language entirely.
    color: "#ef6c00"
    matching_algorithm: 4
    match: flybillett|reisedokument|itinerary|electronic ticket|e-?ticket|booking reference|boarding pass|travel product
  - name: Offentlig
    color: "#616161"
    matching_algorithm: 1
    match: nav altinn folkeregisteret politiet lånekassen

  # ---- Retention axis -----------------------------------------------------
  # The one thing the correspondent/type model does not capture: how long this
  # needs to exist. Paperless will never delete anything on its own, so these are
  # purely a filter for your own periodic cleanout. Assign by hand; there is no
  # text in a document that says how long to keep it, so no match rules here.
  #
  # Rule of thumb only, not legal advice: 5 år covers the window in which tax
  # documentation is normally expected to be producible. Permanent is for things
  # that are painful or impossible to reissue.
  - name: Oppbevaring
    color: "#795548"
    matching_algorithm: 0
    match: ""
  - name: Permanent
    # Vitnemål, skjøte, testament, fødselsattest, vigselsattest, pensjonsbevis.
    parent: Oppbevaring
    color: "#795548"
    matching_algorithm: 0
    match: ""
  - name: 5 år
    parent: Oppbevaring
    color: "#795548"
    matching_algorithm: 0
    match: ""
  - name: 1 år
    parent: Oppbevaring
    color: "#795548"
    matching_algorithm: 0
    match: ""

custom_fields:
  # data_type: string url date boolean integer float monetary documentlink select
  #
  # Archive test for whether a field belongs here: does it help you FIND or VERIFY
  # something later? Forfallsdato failed it — a due date only has value while the
  # bill is unpaid, which is a job this system does not do. Dropped.
  - name: Beløp
    data_type: monetary
  - name: Fakturanummer
    # The reference you quote when disputing a charge or chasing a refund.
    data_type: string
  - name: Kontonummer
    data_type: string
  - name: Garanti utløper
    # Kept despite being a date: this is looked UP ("is this still covered?"),
    # not warned about.
    data_type: date
  - name: Oppbevares til
    data_type: date

storage_paths:
  # Deliberately empty.
  #
  # PAPERLESS_FILENAME_FORMAT in 3-apps/paperless/02-configmap.yaml already lays
  # the media tree out as {{ created_year }}/{{ correspondent }}/{{ created }}_{{ title }},
  # which is what makes a restore-from-restic browsable without the database.
  # A storage path OVERRIDES that format for the documents it matches, so adding
  # them piecemeal gives you a media tree with two competing layouts — the exact
  # thing the global format was chosen to avoid.
  #
  # Add one only when you have a concrete reason to file a subset differently.

mail_rules:
  # Gmail ingestion. The mail ACCOUNT (server, username, app password) is created
  # by hand in the UI and is not managed here — it holds a credential. The rules
  # reference it by name and contain no secrets, so they live in Git.
  #
  # Enum values, from paperless_mail/models.py:
  #   action:                    1=delete 2=move 3=mark-read 4=flag 5=tag
  #   assign_title_from:         1=subject 2=attachment filename 3=none
  #   assign_correspondent_from: 1=none 2=email address 3=name 4=fixed
  #
  # assign_correspondent_from is deliberately 1 (none). Option 3 sounds right but
  # falls back to the mail address when the sender has no display name, and the
  # first import produced correspondents called "noreply@posten.no",
  # "donotreply@elkjop.no" and "GastroPlanner Order". A correspondent is a
  # retrieval axis you live with for years, so it is better derived from the
  # document content by the literal match rules in ~/paperless-seed/correspondents.yaml
  # ("Posten", "Elkjøp") than from whichever mailbox happened to send it.
  #   attachment_type:           1=attachments only 2=include inline attachments
  #   consumption_scope:         1=attachments only 2=.eml only 3=.eml + attachments
  #
  # See gmail.md for why each non-default value is what it is. The short version:
  # action 3 (the default) skips mail that was already read, which would silently
  # drop over half the archive; attachment_type 2 turns every email-signature logo
  # into a document.
  #
  # Staged rollout: only the first rule is enabled. Flip `enabled: true` on the
  # others and re-run seed.py once the first has been verified.

  - name: Kvitteringer
    account: gmail
    enabled: true
    order: 10
    # NOTE the two spellings of a nested Gmail label. Here it is the IMAP folder
    # name, with `/`. In Gmail's own *search* box the same label is written
    # `label:_viktig-_kvitteringer`, with a hyphen. Both are correct; only the
    # slash form works as a rule folder.
    folder: _viktig/_Kvitteringer
    # Widened from 30 after the first run proved the pipeline. Gmail reports ~201
    # threads in this label over 365 days (~230+ messages), and consumption_scope
    # 3 yields roughly 1.6 documents per mail, so expect ~350-400 documents.
    # Set 0 for the full 769 once this run is judged.
    maximum_age: 365
    action: 5
    action_parameter: paperless # becomes a Gmail label on consumed mail
    consumption_scope: 3
    attachment_type: 1
    filter_attachment_filename_exclude: "*.png,*.gif,*.jpg,*.svg"
    assign_title_from: 1
    assign_correspondent_from: 1
    assign_document_type: Kvittering

  - name: Fakturaer
    account: gmail
    enabled: false
    order: 20
    folder: _viktig/_faktura
    maximum_age: 30
    action: 5
    action_parameter: paperless
    consumption_scope: 3
    attachment_type: 1
    filter_attachment_filename_exclude: "*.png,*.gif,*.jpg,*.svg"
    assign_title_from: 1
    assign_correspondent_from: 1
    assign_document_type: Faktura

  - name: Billetter
    account: gmail
    enabled: false
    order: 30
    folder: _viktig/_billetter
    maximum_age: 30
    action: 5
    action_parameter: paperless
    consumption_scope: 3
    attachment_type: 1
    filter_attachment_filename_exclude: "*.png,*.gif,*.jpg,*.svg"
    assign_title_from: 1
    assign_correspondent_from: 1
    assign_document_type: Billett
    assign_tags:
      - Reise

  - name: Bestillinger
    account: gmail
    enabled: false
    # Lowest priority: a Gmail message can carry several labels, and paperless
    # records the first rule that consumes it. An order confirmation that is also
    # labelled _Kvitteringer should be filed as the receipt, so this runs last.
    order: 40
    folder: _viktig/_bestilling
    maximum_age: 30
    action: 5
    action_parameter: paperless
    consumption_scope: 3
    attachment_type: 1
    filter_attachment_filename_exclude: "*.png,*.gif,*.jpg,*.svg"
    assign_title_from: 1
    assign_correspondent_from: 1
    assign_document_type: Ordrebekreftelse

saved_views:
  # rule_type reference: 3=correspondent is  4=document type is  5=is in inbox
  # 6=has tag  7=has any tag  17=does not have tag
  #
  # Only ONE view is on the dashboard: the ingest queue. An archive's front page
  # should answer "is there anything left to file?" and nothing else — every
  # other view here is a filter you go looking for, not something that presents
  # itself as needing attention.
  - name: Innboks
    show_on_dashboard: true
    show_in_sidebar: true
    sort_field: created
    sort_reverse: true
    rules:
      - rule_type: 5
        value: "true"

  # ---- Retrieval / hygiene (sidebar only) ---------------------------------
  # These trend toward empty in a healthy archive. Correspondent and document
  # type are the two axes you actually search on years later, so a document
  # missing either is a document you will struggle to find again.
  - name: Uten korrespondent
    show_on_dashboard: false
    show_in_sidebar: true
    sort_field: added
    sort_reverse: true
    rules:
      - rule_type: 3
        value: null

  - name: Uten dokumenttype
    show_on_dashboard: false
    show_in_sidebar: true
    sort_field: added
    sort_reverse: true
    rules:
      - rule_type: 4
        value: null

  - name: Uten tagger
    show_on_dashboard: false
    show_in_sidebar: true
    sort_field: added
    sort_reverse: true
    rules:
      - rule_type: 7
        value: "false"

  - name: Purringer
    # Sidebar, deliberately NOT the dashboard. As a retrieval filter ("have I
    # ever been chased by these people?") this earns its place in an archive.
    # On the dashboard it would be an alarm, which is the job this system does
    # not have.
    show_on_dashboard: false
    show_in_sidebar: true
    sort_field: created
    sort_reverse: true
    rules:
      - rule_type: 4
        value: "@document_type:Purring"

  - name: Sist lagt til
    show_on_dashboard: false
    show_in_sidebar: true
    sort_field: added
    sort_reverse: true
    rules: []
