apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
data:
  TZ: "Europe/Oslo"
  PAPERLESS_TIME_ZONE: "Europe/Oslo"

  # TLS terminates at the Cilium Gateway, so Django sees a plain-HTTP request on
  # an https:// origin. Without PAPERLESS_URL every login POST is rejected with a
  # CSRF 403 — paperless derives CSRF_TRUSTED_ORIGINS from this value.
  PAPERLESS_URL: "https://paperless.cyberhawk.no"
  # Defaults to "*" when unset. Pinned instead, which means the kubelet's
  # `Host: <podIP>` probe would be rejected — hence the explicit Host header on
  # every probe in 33-paperless-deployment.yaml. Keep the two in sync.
  PAPERLESS_ALLOWED_HOSTS: "paperless.cyberhawk.no,localhost,127.0.0.1"

  # OCR. `nor+eng` is the tesseract language string used per document.
  PAPERLESS_OCR_LANGUAGE: "nor+eng"
  # Space-separated list of tesseract-ocr-<lang> APT PACKAGES, installed by the
  # init-tesseract-langs s6 service on EVERY container start (`apt-get install
  # tesseract-ocr-nor`). This is why the container runs as root with a writable
  # rootfs and why the egress policy has to allow :80/:443 — see the securityContext
  # comment in 33-paperless-deployment.yaml and the egress rule in
  # 50-networkpolicies.yaml. `eng` ships in the image, so only `nor` is listed.
  PAPERLESS_OCR_LANGUAGES: "nor"

  # Human-navigable media tree, which is what makes a restore from the media PVC
  # (or its restic snapshot) tractable without the database.
  #
  # Double-brace Jinja syntax: 3.x deprecated the single-brace form and logs
  # "is using the old style" on every system check. Single braces still work for
  # now, but the tree this produces is the restore path — do not risk it silently
  # changing shape on a future upgrade.
  PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ created }}_{{ title }}"
  # Empty tag/correspondent components collapse instead of leaving stray dirs.
  PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"

  PAPERLESS_CONSUMER_RECURSIVE: "true"
  PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
  # The consume dir is an NFS mount; inotify does not fire reliably across NFS,
  # so poll it instead.
  #
  # The variable is PAPERLESS_CONSUMER_POLLING_*INTERVAL* — 3.x renamed it from
  # PAPERLESS_CONSUMER_POLLING, and the old name is not aliased, it is simply
  # ignored. Nothing warns about it: the app starts fine and the only trace is
  # the consumer logging "Watching /usr/src/paperless/consume using native file
  # system events" instead of "using polling (interval: 30.0s)". Check that line
  # after any change here. (PAPERLESS_CONSUMER_POLLING_RETRY_COUNT is gone in 3.x
  # too — the setting no longer exists, so it is not set.)
  PAPERLESS_CONSUMER_POLLING_INTERVAL: "30"

  # The port granian binds. Pinned rather than left to default because the Service
  # is also called `paperless`: with serviceLinks enabled the kubelet would set
  # PAPERLESS_PORT=tcp://<clusterIP>:8000 and granian would refuse to start. See
  # the enableServiceLinks comment in 33-paperless-deployment.yaml.
  PAPERLESS_PORT: "8000"

  PAPERLESS_TASK_WORKERS: "2"
  PAPERLESS_THREADS_PER_WORKER: "2"
  PAPERLESS_WEBSERVER_WORKERS: "2"

  # init-modify-user remaps the in-image `paperless` account to these before
  # chowning the volumes. Must match fsGroup in the pod securityContext.
  USERMAP_UID: "1000"
  USERMAP_GID: "1000"

  # Created on first boot only; the password comes from paperless-secret.
  PAPERLESS_ADMIN_USER: "admin"
  PAPERLESS_ADMIN_MAIL: "jochristian@cyberhawk.no"
