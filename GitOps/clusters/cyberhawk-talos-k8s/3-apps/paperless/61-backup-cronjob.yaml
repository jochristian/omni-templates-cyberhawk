apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-db-dump
spec:
  # Ahead of the volsync ReplicationSource (05:30), so the mover never races this
  # job for the ReadWriteOnce PVC.
  schedule: "45 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: paperless-db-dump
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/zone
                        operator: In
                        values:
                          - blix
          securityContext:
            # ghcr.io/cloudnative-pg/postgresql declares a numeric USER 26.
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ts="$(date +%Y%m%d-%H%M%S)"
                  out="/backup/paperless-${ts}.dump"
                  pg_dump -Fc -d "$DATABASE_URL" -f "$out"
                  # The volsync mover runs as uid 1000 and must be able to read this.
                  chmod 0644 "$out"
                  # Keep the 7 most recent dumps.
                  ls -1t /backup/paperless-*.dump | tail -n +8 | xargs -r rm -f
                  echo "wrote ${out}"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: paperless-db-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: paperless-backup
            - name: tmp
              emptyDir: {}
