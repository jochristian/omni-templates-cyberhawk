apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless

generators:
  - 01-secret.yaml
  - 20-valkey-secret.yaml
  - 62-volsync-secret.yaml
  - 63-media-volsync-secret.yaml

components:
  - ../../base/volsync-backup

resources:
  - 02-configmap.yaml
  - 10-cnpg-cluster.yaml
  - 21-valkey-pvc.yaml
  - 22-valkey-deployment.yaml
  - 23-valkey-service.yaml
  - 30-data-pvc.yaml
  - 31-media-pvc.yaml
  - 32-consume-pvc.yaml
  - 33-paperless-deployment.yaml
  - 34-paperless-service.yaml
  - 40-httproute.yaml
  - 50-networkpolicies.yaml
  - 60-backup-pvc.yaml
  - 61-backup-cronjob.yaml
  - 64-media-replicationsource.yaml
  - 70-gotenberg-deployment.yaml
  - 71-gotenberg-service.yaml
  - 72-tika-deployment.yaml
  - 73-tika-service.yaml

images:
  - name: ghcr.io/paperless-ngx/paperless-ngx
    # No `v` prefix on the ghcr tags, unlike the GitHub release names (v3.0.5).
    newTag: "3.1.3" # renovate: docker=ghcr.io/paperless-ngx/paperless-ngx
  - name: valkey/valkey
    newTag: "9.1-alpine" # renovate: docker=valkey/valkey
  - name: ghcr.io/cloudnative-pg/postgresql
    newTag: "17" # renovate: docker=ghcr.io/cloudnative-pg/postgresql
  - name: gotenberg/gotenberg
    newTag: "8.36.0" # renovate: docker=gotenberg/gotenberg
  - name: apache/tika
    # Four-part version (Tika release + image revision). The `-full` variants add
    # OCR and extra parsers that paperless does not need for mail bodies.
    newTag: "3.3.1.0" # renovate: docker=apache/tika

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: paperless

patches:
  # Retarget the shared volsync component at the pg_dump PVC. The media volume
  # gets its own ReplicationSource in 64-media-replicationsource.yaml.
  - target:
      kind: ReplicationSource
      name: backup-placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: paperless-backup
      - op: replace
        path: /spec/sourcePVC
        value: paperless-backup
      - op: replace
        path: /spec/restic/repository
        value: s3-backup-hetzner-paperless
      - op: replace
        path: /spec/trigger/schedule
        value: "30 5 * * *"
