apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17 # renovate: docker=ghcr.io/cloudnative-pg/postgresql
  postgresql:
    parameters:
      # CNPG defaults to 100. A bulk mail import drove paperless to ~95 concurrent
      # connections on 2026-08-22 and 28 mails then failed to consume with
      # "remaining connection slots are reserved for roles with the SUPERUSER
      # attribute" — which reads like an auth error and is not one.
      #
      # Follow-up: that spike was NOT ingestion volume, which is what it looked
      # like at the time. The same 416-message label re-run cleanly afterwards
      # peaked at 5 connections. The first run was failing on every mail, and the
      # failure/retry churn is what consumed the pool -- fixing the underlying
      # error removed the pressure entirely.
      #
      # 200 is kept anyway: headroom is cheap, it removes a whole class of
      # incident from bulk imports, and the memory limit below was raised to
      # match. But do not read a connection spike as "needs a bigger ceiling"
      # without first checking whether something is failing in a loop.
      #
      # NOTE: max_connections is a postmaster-level setting. CNPG can only apply
      # it by restarting the instance, and instances is 1, so this change means a
      # short database outage when it syncs.
      max_connections: "200"
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: paperless
  storage:
    size: 10Gi
    storageClass: democratic-csi-iscsi
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      # Deliberately no locale override. The CNPG image only ships C / C.UTF-8 /
      # en_US.UTF-8, so asking for nb_NO.UTF-8 fails initdb outright. Paperless
      # does its full-text search in the Whoosh index on the data PVC, not in
      # Postgres, so database collation does not affect Norwegian search.
  # iSCSI target is blix-side; a lørenskog attachment runs its block I/O over the
  # inter-site WireGuard link and flips ext4 to emergency_ro on a blip.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - blix
  # Raised with max_connections. A Postgres backend is a process: 200 of them
  # cost real memory on top of shared_buffers (128Mi here), and work_mem is
  # per-sort, so the worst case scales with the connection count too. At 94
  # connections the pod was already using 281Mi of the old 1Gi limit — doubling
  # the ceiling without doubling the limit risks OOMKilling the only instance,
  # which is a worse failure than the connection errors this is fixing.
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 2Gi
