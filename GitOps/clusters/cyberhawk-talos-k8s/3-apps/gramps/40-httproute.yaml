apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gramps
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - gramps.cyberhawk.no
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gramps
          port: 5000
