# NetBox exposes django-prometheus metrics at /metrics when METRICS_ENABLED=true
# (02-configmap.yaml). Prometheus only scrapes monitors carrying the
# `release: monitoring` label — see the kube-prometheus-stack notes in CLAUDE.md.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: netbox
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      # Applied to every resource by the kustomization's `labels:` block. The
      # named port is what narrows this to the web Service — netbox-valkey shares
      # the label but has no port called `http`.
      app.kubernetes.io/name: netbox
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      # Prometheus scrapes `<podIP>:8080`, so the request carries `Host: <podIP>`,
      # which NetBox's ALLOWED_HOSTS rejects with 400 (same trap as the probes in
      # 31-netbox-deployment.yaml). ServiceMonitors can't set a Host header, so
      # scrape through the Service DNS name instead — it is in ALLOWED_HOSTS.
      # `instance` becomes the Service address; the `pod` label still identifies
      # the pod. Fine while netbox runs 1 replica; with
      # more, each scrape would hit whichever pod the Service picks.
      relabelings:
        - action: replace
          targetLabel: __address__
          replacement: netbox.netbox.svc.cluster.local:8080
