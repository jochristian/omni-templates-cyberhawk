apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17 # renovate: docker=ghcr.io/cloudnative-pg/postgresql
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: netbox
  storage:
    size: 10Gi
    storageClass: democratic-csi-iscsi
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
  # iSCSI target is blix-side; a lørenskog attachment runs its block I/O over the
  # inter-site WireGuard link and flips ext4 to emergency_ro on a blip.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - blix
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
