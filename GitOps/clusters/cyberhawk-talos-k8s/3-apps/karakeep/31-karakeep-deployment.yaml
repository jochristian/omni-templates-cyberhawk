apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      # iSCSI PVC (karakeep-data): must stay on blix, where the target lives. See the
      # note in 2-services/pdns/20-deployment.yaml — a lørenskog pod runs its block I/O
      # over the inter-site link and a blip leaves the volume stuck read-only.
      nodeSelector:
        topology.kubernetes.io/zone: blix
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: NEXTAUTH_URL
            - name: DATA_DIR
              value: "/data"
            # Single-user instance: close public registration. Karakeep defaults
            # DISABLE_SIGNUPS to "false", i.e. anyone reaching the UI can create an
            # account — and the UI is exposed to `world` by the karakeep
            # CiliumNetworkPolicy. Existing users are unaffected; new accounts must be
            # made via an admin invite.
            - name: DISABLE_SIGNUPS
              value: "true"
            - name: MEILI_ADDR
              value: "http://meilisearch:7700"
            - name: BROWSER_WEB_URL
              value: "http://chrome:9222"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: NEXTAUTH_SECRET
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: MEILI_MASTER_KEY
            - name: NEXT_PUBLIC_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secret
                  key: NEXT_PUBLIC_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '100m'
              memory: '512Mi'
            limits:
              memory: '1Gi'
          volumeMounts:
            - name: karakeep-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: karakeep-data
          persistentVolumeClaim:
            claimName: karakeep-data
