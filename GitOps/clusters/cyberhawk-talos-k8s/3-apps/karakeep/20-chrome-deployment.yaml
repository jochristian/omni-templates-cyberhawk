apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: karakeep
spec:
  # replicas intentionally omitted: KEDA (22-chrome-scaledobject.yaml) owns the count
  # via an HPA and parks chrome to zero overnight. Pinning it here would make ArgoCD
  # flap OutOfSync on every scale event.
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      # Stands in for compose `init: true`: the pause container reaps Chrome's zombies.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome
          imagePullPolicy: IfNotPresent
          # The entrypoint adds --no-sandbox and forwards 9222 to Chrome's internal
          # debugging port; passing --remote-debugging-* here breaks that.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          ports:
            - containerPort: 9222
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              memory: '1Gi'
