apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: argocd-sops-age-key
          secret:
            secretName: argocd-sops-age-key
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          # Image is distroless from v4.4.0 onward (no shell), so the install is
          # done via the built-in `ksops install` subcommand rather than `sh -c`/mv.
          # Only the ksops plugin binary is installed — deliberately NOT
          # `--with-kustomize`. KSOPS pins kustomize v5.3.0 (hardcoded in its
          # scripts/install-kustomize.sh, still true as of v4.5.1), and kustomize
          # only learned to drive Helm 4 in v5.8.1 (kubernetes-sigs/kustomize#6013:
          # older kustomize probes `helm version -c --short`, and Helm 4 removed
          # -c/--client). ArgoCD 3.5 ships Helm 4 as the only helm binary, so
          # overriding its kustomize would break every `helmCharts:` render.
          # ksops is an exec plugin (KRM function protocol) and does not need a
          # version-matched kustomize — just --enable-alpha-plugins --enable-exec,
          # set in argocd-cm.
          command:
            ["/usr/local/bin/ksops", "install", "/custom-tools"]
          # Match the hardened securityContext of the sibling containers (copyutil /
          # repo-server). runAsUser must be the numeric distroless `nonroot` uid (65532):
          # with only `runAsNonRoot: true` the kubelet refuses to start the container
          # because it can't verify a non-numeric image user. Verified the install runs
          # under a read-only rootfs as uid 65532.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
          volumeMounts:
            # No /usr/local/bin/kustomize mount: ArgoCD's own kustomize is used
            # (see the install-ksops comment above).
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: argocd-sops-age-key
