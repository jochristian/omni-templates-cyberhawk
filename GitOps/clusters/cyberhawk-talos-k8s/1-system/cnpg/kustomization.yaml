apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.0 # renovate: helm=cloudnative-pg repo=https://cloudnative-pg.github.io/charts
    releaseName: cloudnative-pg
    namespace: cnpg
    valuesInline:
      monitoring:
        podMonitorEnabled: false
      # Keep the operator on blix. It is a leader-elected controller watching the API
      # server continuously, so at lørenskog every lease renewal crosses the inter-site
      # link and it restarts on each blip (8 restarts on 2026-08-07, alongside the CSI
      # controllers). Nothing about the operator needs to be at lørenskog — the
      # Postgres clusters it manages are scheduled independently of it.
      nodeSelector:
        topology.kubernetes.io/zone: blix
