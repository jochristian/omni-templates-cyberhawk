# Daily because drift only happens after a node outage, and an imbalanced day
# costs nothing (the 2026-10-03 drift ran for weeks unnoticed).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: placement-rebalance
  namespace: kube-system
  labels:
    app.kubernetes.io/name: placement-rebalance
spec:
  schedule: "20 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: placement-rebalance
        spec:
          serviceAccountName: placement-rebalance
          restartPolicy: Never
          # Talks only to the API server, and is itself tier 2 (blix).
          nodeSelector:
            topology.kubernetes.io/zone: blix
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rebalance
              image: docker.io/alpine/k8s
              command: ["bash", "/scripts/placement-rebalance.sh"]
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: placement-rebalance
            - name: tmp
              emptyDir: {}
