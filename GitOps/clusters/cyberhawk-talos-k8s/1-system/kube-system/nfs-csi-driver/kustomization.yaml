apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: csi-driver-nfs
    repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    version: 4.13.4
    releaseName: csi-driver-nfs
    namespace: kube-system
    includeCRDs: true
    valuesInline:
      externalSnapshotter:
        enabled: false
      controller:
        enableSnapshotter: true
        # Leader-elected sidecars (provisioner/snapshotter) exit on lost leadership, so
        # keep the controller off the inter-site link. NFS mounts themselves work from
        # either site; the node DaemonSet is unaffected.
        # (the chart template adds kubernetes.io/os itself; repeating it breaks the render)
        nodeSelector:
          topology.kubernetes.io/zone: blix
