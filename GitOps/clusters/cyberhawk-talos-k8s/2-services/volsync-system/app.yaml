---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backube.github.io/helm-charts/
    chart: volsync
    targetRevision: 0.15.0
    helm:
      values: |
        metrics:
          disableAuth: true
        # Chart default requests 100m CPU; actual usage is a couple ms
        # (2026-09-17 worker placement rebalance, phase 1 — see
        # docs/superpowers/specs/2026-09-16-worker-placement-rebalance-design.md).
        resources:
          requests:
            cpu: 25m
  destination:
    server: https://kubernetes.default.svc
    namespace: volsync-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
