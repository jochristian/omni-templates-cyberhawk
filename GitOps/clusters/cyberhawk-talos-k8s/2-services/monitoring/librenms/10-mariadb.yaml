apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: monitoring
spec:
  # Propagated by mariadb-operator to all child resources (incl. the
  # StatefulSet) — satisfies the kyverno require-labels policy.
  inheritMetadata:
    labels:
      app.kubernetes.io/name: mariadb

  # Root password — add MARIADB_ROOT_PASSWORD key to librenms-secret SOPS file
  rootPasswordSecretKeyRef:
    name: librenms-secret
    key: MARIADB_ROOT_PASSWORD

  replicas: 2

  replication:
    enabled: true
    primary:
      podIndex: 0
      autoFailover: true

  port: 3306

  env:
    - name: TZ
      value: Europe/Oslo

  args:
    - --innodb-file-per-table=1
    - --lower-case-table-names=0
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    # Binlogs never expire by default; on 2026-09-27 they filled the primary's
    # 10Gi volume. 7 days is plenty for replica catch-up.
    - --binlog-expire-logs-seconds=604800
    # MariaDB 11.4+ skips auto-purge unless a replica is connected — a primary
    # whose replica is broken would otherwise fill up again.
    - --slave-connections-needed-for-purge=0

  # 20Gi since 2026-09-28 (binlog disk-full incident).
  storage:
    size: 20Gi
    storageClassName: democratic-csi-iscsi

  # Pin to Blix DC nodes — ctrl-00 and ctrl-01 carry zone=blix label
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - blix

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
