apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

# --- Out-of-band device state (lives in the LibreNMS DB, NOT in Git) ---------
# 192.168.100.1 (sysName "4g-router", OS detected as `generic`) has the
# `netstats` poller module disabled via its devices_attribs row
# (poll_netstats = 0), set from the web UI -> device -> Modules tab.
#
# Why: the router answers snmpwalk fine but times out on the netstats counter
# OIDs (icmp/ip/ip_forward/snmp/udp/tcp). Those snmpgets burned 42.9s of a 47.3s
# poll -- half the whole poll budget -- to produce 4 RRD updates. Disabling it
# took the device to 4.5s and the dispatcher from ~0.25 to ~0.14 cores.
#
# Do NOT try to express this as
#   $config['os']['generic']['poller_modules']['netstats'] = false;
# in a /data/config/*.php ConfigMap. ConfigRepository::getCombined() ends with
# array_unique(array_merge($global, $os)), which collapses the boolean module
# map; every key it drops falls through to `?? false`, silently disabling
# ports/sensors/everything except core. The per-device attrib is the only safe
# route, and it has to be re-applied if this instance is ever rebuilt.
# ----------------------------------------------------------------------------

generators:
  - 01-secret.yaml
  - 60-volsync-secret.yaml

components:
  - ../../../base/volsync-backup

resources:
  - 02-configmap.yaml
  - 10-mariadb.yaml            # MariaDB CR — managed by mariadb-operator
  - 11-mariadb-database.yaml  # Database, User, Grant CRs
  - 20-valkey-deployment.yaml
  - 21-valkey-service.yaml
  - 22-rrdcached-deployment.yaml
  - 23-rrdcached-service.yaml
  - 30-librenms-pvc.yaml
  - 31-librenms-deployment.yaml
  - 32-librenms-service.yaml
  - 33-librenms-dispatcher-deployment.yaml
  - 34-librenms-snmp-scan-cronjob.yaml


images:
  - name: librenms/librenms
    newTag: "26.8.2"
  - name: valkey/valkey
    newTag: "9.1-alpine"
  - name: crazymax/rrdcached
    newTag: "1.9.0-r4"

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: librenms

patches:
  - target:
      kind: ReplicationSource
      name: backup-placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: librenms-backup
      - op: replace
        path: /spec/sourcePVC
        value: librenms-data
      - op: replace
        path: /spec/restic/repository
        value: s3-backup-hetzner-librenms
      - op: replace
        path: /spec/trigger/schedule
        value: "15 6 * * *"
