apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-forgejo
spec:
  # Same nightly window as the GitHub run, offset 30 min so the two don't
  # contend for CPU on the node.
  schedule: "30 2 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # The image's own user: nix needs a passwd entry for its home directory.
            runAsUser: 12021
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              # full: nix preinstalled (flake.lock in nixos-config); the slim image's
              # on-demand install fails on the read-only root filesystem.
              image: renovate/renovate:full
              imagePullPolicy: Always
              env:
                # Bot config (platform/repos/onboarding) from the ConfigMap.
                - name: RENOVATE_CONFIG_FILE
                  value: /etc/renovate/config.json
                # readOnlyRootFilesystem: keep all writes (git clone, cache, git config)
                # on the /tmp emptyDir.
                - name: RENOVATE_BASE_DIR
                  value: /tmp/renovate
                - name: HOME
                  value: /tmp
                - name: LOG_LEVEL
                  value: info
                # Forgejo PAT. Renovate's forgejo platform clones and opens PRs
                # over HTTPS with this token, so no SSH key is needed here.
                # Scopes: read:user, read:organization, write:issue, write:repository.
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-forgejo-secret
                      key: RENOVATE_TOKEN
                # Registry lookups (ghcr.io, Docker Hub) still go to GitHub/upstream,
                # so the GitHub token is reused purely for release-notes fetching.
                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secret
                      key: RENOVATE_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # nix flake update was OOMKilled at 1Gi.
                  memory: 3Gi
              volumeMounts:
                - name: config
                  mountPath: /etc/renovate
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: renovate-forgejo-config
            - name: tmp
              emptyDir: {}
