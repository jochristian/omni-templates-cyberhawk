apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitors.yaml

configMapGenerator:
  - name: grafana-dashboard-argocd
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - argocd.json

  - name: grafana-dashboard-cilium-agent
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - cilium-agent.json

  - name: grafana-dashboard-cilium-operator
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - cilium-operator.json

  - name: grafana-dashboard-hubble
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - hubble.json

  - name: grafana-dashboard-cert-manager
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - cert-manager.json

  - name: grafana-dashboard-tetragon
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - tetragon.json

  - name: grafana-dashboard-gatus
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - gatus.json

  - name: grafana-dashboard-keda
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - keda.json

  # Loki-backed, not Prometheus: fed by 2-services/monitoring/hubble-export via
  # Alloy under job="hubble". Distinct from hubble.json, which is the official
  # metrics dashboard built on the hubble_* series.
  - name: grafana-dashboard-hubble-policy-drops
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - hubble-policy-drops.json
